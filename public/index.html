<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="referrer" content="no-referrer">
  <title>Splooge Week</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a6ef5'/%3E%3Cpath d='M9 22V10h3v12zm5 0V14h3v8zm5 0v-5h3v5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 id="league-name">Splooge <span class="word-slot" id="title-word"><span class="word">Week</span></span></h1>
      <p id="subtitle" class="subtitle">Loading…</p>
    </header>

    <div class="modebar">
      <div class="segmented" role="group" aria-label="Standing and record view">
        <button type="button" data-mode="current" aria-pressed="true">Current</button>
        <button type="button" data-mode="projected" aria-pressed="false">Projected</button>
      </div>
      <button id="players-toggle" class="players-btn" type="button" aria-pressed="false">
        <span class="live-dot" aria-hidden="true"></span>Active Players
      </button>
    </div>

    <main id="board" class="board" aria-live="polite">
      <div class="row head teams-head" role="row">
        <span class="c-idx" aria-label="Row">#</span>
        <span class="c-team">Team</span>
        <button class="c-std sort" data-key="standing" type="button" aria-label="Standing"><span class="lbl-short">Std</span><span class="lbl-long">Standing</span></button>
        <button class="c-rec sort" data-key="record" type="button" aria-label="Record"><span class="lbl-short">W-L</span><span class="lbl-long">Record</span></button>
        <button class="c-pts sort" data-key="points" type="button" aria-label="Points"><span class="lbl-short">Pts</span><span class="lbl-long">Points</span></button>
        <button class="c-proj sort" data-key="projected" type="button">Proj</button>
      </div>
      <div class="row head players-head" role="row" hidden>
        <span class="c-player">Player</span>
        <span class="c-fteam">Team</span>
        <button class="c-pts sort" data-pkey="points" type="button">Score</button>
        <button class="c-proj sort" data-pkey="projected" type="button">Projected</button>
      </div>
      <div id="banner" class="banner" hidden></div>
      <div id="rows" class="rows"></div>
    </main>
  </div>
  <script src="app.js" type="module"></script>
</body>
</html>
